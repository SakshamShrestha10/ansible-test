---
- hosts: all
  become: true

  tasks:
  - name: Copy files
    copy:
      src: "{{ item.src }}"
      dest: "{{ item.dest }}"
      owner: "{{ item.owner }}"
      group: "{{ item.group }}"
      mode: "{{ item.mode }}"
    loop:
    - { src: "/home/saksham/playbooks", dest: "/backup", owner: "saksham", group: "broadway", mode: "770" }
    - { src: "/home/saksham/chatapp", dest: "/", owner: "usera", group: "docker", mode: "750" } 
