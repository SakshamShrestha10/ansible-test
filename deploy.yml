---
- hosts: dev

  tasks:
  - name: Install nginx
    apt:
      name: nginx
      state: present

  - name: Start and enable nginx
    service:
      name: nginx
      state: started
      enabled: true

  - name: Create project directory
    file:
      path: /var/www/site1
      state: absent

  - name: Copy files
    copy:
      src: "{{ item.src }}"
      dest: "{{ item.dest }}"
    loop:
    - src: /home/saksham/cv_web/
      dest: /var/www/site1/

    - src: /home/saksham/site1
      dest: /etc/nginx/sites-available
    notify:
    - restart nginx

  - name: Link config files
    file:
      src: /etc/nginx/sites-available/site1
      dest: /etc/nginx/sites-enabled/site1
      state: link

  handlers:
  - name: restart nginx
    service:
      name: nginx
      state: restarted
  
