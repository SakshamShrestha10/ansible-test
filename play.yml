---
- hosts: all
  become: true

  tasks:
  - name: Install package
    apt:
      name: "{{ item }}"
      state: present
    when: inventory_hostname in groups ['dev']
    loop:
    - nginx
    - maven
    - openjdk-17-jdk
      
  - name: Create directory
    file:
      path: /home/condition/tasks
      state: directory
    when: inventory_hostname in groups ['test']
